[project]
name = "quick-vault-retriever"
version = "0.1.0"
description = "Fast, read-only, source-cited retrieval for local JSONL vaults and Raycast."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Viggo Meesters" }]
keywords = ["jsonl", "raycast", "retrieval", "sqlite", "fts5", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/viggomeesters/quick-vault-retriever"
Repository = "https://github.com/viggomeesters/quick-vault-retriever"
Issues = "https://github.com/viggomeesters/quick-vault-retriever/issues"

[project.scripts]
quick-vault = "quick_vault_retriever.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=quick_vault_retriever --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "CPY001", "D", "EM101", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "S603", "TC003"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true
